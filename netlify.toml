[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — toda rota volta pro index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache agressivo dos assets versionados (Vite gera hashes)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
